<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperChat</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ec; --user:#2f5bea; --userink:#fff;
          --bot:#fff; --flights:#2f80ed; --shopping:#d9822b; --cinema:#9b51e0; --other:#7d8597; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1c2028; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2b313d;
          --bot:#232833; --user:#4a6ff0; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display:grid; grid-template-columns: 1fr 340px; height:100vh; max-width:1200px; margin:0 auto; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; } header .sub { color:var(--muted); font-size:13px; }
  header button { margin-left:auto; }
  .chat { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:var(--userink); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .tag { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
         padding:1px 8px; border-radius:99px; color:#fff; margin-bottom:6px; background:var(--other); }
  .tag.flights { background:var(--flights); } .tag.shopping { background:var(--shopping); } .tag.cinema { background:var(--cinema); }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line); background:var(--panel); }
  input { flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; background:var(--bg); color:var(--ink); }
  button { padding:10px 16px; border:0; border-radius:10px; background:var(--user); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  aside { padding:16px; overflow-y:auto; background:var(--panel); }
  aside h2 { font-size:13px; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; margin:14px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:13px; padding:5px 10px; border-radius:99px; border:1px solid var(--line); background:var(--bg); cursor:pointer; color:var(--ink); }
  pre { font-size:11.5px; background:var(--bg); padding:10px; border-radius:8px; overflow-x:auto; max-height:45vh; }
  @media (max-width: 820px) { .wrap { grid-template-columns:1fr; } aside { display:none; } .msg { max-width:92%; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="chat">
    <header><div><h1>SuperChat</h1><div class="sub">Flights · Shopping · Cinema — one chat (EN / AZ / RU)</div></div>
      <button class="ghost" id="reset">New chat</button></header>
    <div id="log"></div>
    <form id="f"><input id="q" autocomplete="off" placeholder="Ask about flights, products or films…" autofocus><button>Send</button></form>
  </section>
  <aside>
    <h2>Try</h2>
    <div class="chips" id="chips"></div>
    <h2>Last routing decision</h2>
    <pre id="route">—</pre>
    <h2>Session state</h2>
    <pre id="state">—</pre>
  </aside>
</div>
<script>
const examples = ["Find me a flight from Baku to Istanbul on Friday", "The cheaper one, is it direct?", "What is playing tonight?",
  "Do you have wireless headphones under 100 AZN?", "Okay, and the sci-fi one, any seats on Saturday?",
  "I need a flight to Istanbul on 6 November and a backpack for the trip", "Back to the headphones", "Book two seats",
  "Show me something good", "What is the weather in Ganja?", "Bu axşam hansı filmlər gedir?", "Найди рейс в Дубай"];
const LABEL = {flights:"✈ Flights", shopping:"🛍 Shopping", cinema:"🎬 Cinema", mixed:"Mixed", followup:"Follow-up",
  ambiguous:"Clarifying", out_of_scope:"Out of scope", greeting:"Hello"};
let sid = null;
try { sid = sessionStorage.getItem("sc_sid"); } catch (e) {}
const log = document.getElementById("log"), q = document.getElementById("q");
function add(text, who, r) {
  const d = document.createElement("div"); d.className = "msg " + who;
  if (r) { const t = document.createElement("span"); const dom = r.domains.length === 1 ? r.domains[0] : "";
    t.className = "tag " + dom; t.textContent = (r.category === "followup" ? "Follow-up · " + (LABEL[dom] || "") : LABEL[r.category]);
    d.appendChild(t); d.appendChild(document.createElement("br")); }
  d.appendChild(document.createTextNode(text)); log.appendChild(d); log.scrollTop = log.scrollHeight;
}
async function send(text) {
  add(text, "user");
  try {
    const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: sid, message: text})});
    const r = await res.json();
    sid = r.session_id; try { sessionStorage.setItem("sc_sid", sid); } catch (e) {}
    add(r.reply, "bot", r);
    document.getElementById("route").textContent = JSON.stringify({category:r.category, domains:r.domains, lang:r.lang, cues:r.cues}, null, 1);
    document.getElementById("state").textContent = JSON.stringify(r.state, null, 1);
  } catch (e) { add("Connection problem — please try again.", "bot"); }
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); const v = q.value.trim(); if (v) { q.value = ""; send(v); } };
document.getElementById("reset").onclick = async () => { if (sid) await fetch("/api/reset", {method:"POST", body: JSON.stringify({session_id:sid})});
  log.innerHTML = ""; add("New chat started. Ask me about flights, products or films.", "bot"); };
const chips = document.getElementById("chips");
examples.forEach(x => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = x; b.onclick = () => send(x); chips.appendChild(b); });
add("Hi! I can find flights ✈, products 🛍 and films 🎬 — all in this one chat. Write in English, Azərbaycanca or по-русски.", "bot");
</script>
</body>
</html>
